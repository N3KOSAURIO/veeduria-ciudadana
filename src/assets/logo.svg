<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Veeduría Ciudadana logo - Watch Us">
  <defs>
    <clipPath id="tri-clip">
      <polygon points="100,25 35,138 165,138"/>
    </clipPath>
  </defs>

  <!-- Triangle: white fill with thick black outline -->
  <polygon
    points="100,25 35,138 165,138"
    fill="#ffffff"
    stroke="#111111"
    stroke-width="4.5"
    stroke-linejoin="round"
  />

  <!-- Thin white inner border (clipped to interior → white line inside black outline) -->
  <polygon
    points="100,25 35,138 165,138"
    fill="none"
    stroke="#ffffff"
    stroke-width="2"
    stroke-linejoin="round"
    clip-path="url(#tri-clip)"
  />

  <!-- W letter (top) -->
  <text
    x="100" y="82"
    font-family="Georgia, 'Times New Roman', Times, serif"
    font-size="46"
    font-weight="bold"
    font-style="normal"
    fill="#111111"
    text-anchor="middle"
  >W</text>

  <!-- U letter (bottom) -->
  <text
    x="100" y="128"
    font-family="Georgia, 'Times New Roman', Times, serif"
    font-size="46"
    font-weight="bold"
    font-style="normal"
    fill="#111111"
    text-anchor="middle"
  >U</text>
</svg>
